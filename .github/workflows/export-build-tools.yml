name: Export Android build tools

on:
  push:
    paths:
      - '.github/workflows/export-build-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Prepare tools
        run: |
          mkdir -p export/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" export/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" export/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/lib/
          chmod +x export/apksigner export/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools-35
          path: export
          retention-days: 1
